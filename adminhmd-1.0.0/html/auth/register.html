<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Création de compte NEXORA pour la gestion commerciale">
  <title>Création de compte | NEXORA</title>

  <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body class="auth-body">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
  </button>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="../dashboard/index.html"><span class="brand-icon"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i></span><span><strong>NEXORA</strong><small>Créez votre compte de gestion.</small></span></a>
      <form class="needs-validation" data-register-form novalidate>
        <div class="mb-4">
          <p class="eyebrow mb-1">Accès sécurisé</p>
          <h1 class="h3 mb-1">Création de compte</h1>
          <p class="text-muted mb-0">Créez votre compte NEXORA.</p>
        </div>
        <div class="mb-3"><label class="form-label" for="registerName">Nom complet</label><input class="form-control" id="registerName" type="text" required><div class="invalid-feedback">Le nom complet est requis.</div></div>
        <div class="mb-3"><label class="form-label" for="registerEmail">Adresse e-mail</label><input class="form-control" id="registerEmail" type="email" required><div class="invalid-feedback">Saisissez une adresse e-mail valide.</div></div>
        <div class="mb-3"><label class="form-label" for="registerPin">Code PIN</label><input class="form-control" id="registerPin" type="password" inputmode="numeric" maxlength="6" minlength="4" required><div class="invalid-feedback">Le code PIN doit contenir entre 4 et 6 chiffres.</div></div>
        <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="terms" required><label class="form-check-label" for="terms">J’accepte les conditions d’utilisation</label><div class="invalid-feedback">Vous devez accepter avant de continuer.</div></div>
        <div class="alert alert-danger d-none" data-register-error role="alert"></div>
        <button class="btn btn-primary w-100" type="submit" data-register-submit><i class="bi bi-person-plus" aria-hidden="true"></i> Créer le compte</button>
      </form>
      
      <div class="auth-footer">Vous avez déjà un compte ? <a href="login.html">Se connecter</a></div>
    </section>
  </main>

  <script src="../../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script>
    document.querySelector('[data-register-form]').addEventListener('submit', function (event) {
      event.preventDefault();
      var form = event.currentTarget;
      var pin = document.getElementById('registerPin').value;
      if (!form.checkValidity() || !/^\d{4,6}$/.test(pin)) {
        form.classList.add('was-validated');
        return;
      }

      var button = form.querySelector('[data-register-submit]');
      var errorElement = form.querySelector('[data-register-error]');
      button.disabled = true;
      errorElement.classList.add('d-none');

      window.NexoraAPI.register(
        document.getElementById('registerName').value.trim(),
        document.getElementById('registerEmail').value.trim(),
        pin
      ).then(function () {
        window.location.href = 'login.html?registered=1';
      }).catch(function (error) {
        errorElement.textContent = error.message;
        errorElement.classList.remove('d-none');
        button.disabled = false;
      });
    });
  </script>
</body>
</html>
