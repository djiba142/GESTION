<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Réinitialisation du code PIN NEXORA">
  <title>Nouveau code PIN | NEXORA</title>
  <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="auth-body">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Changer de thème" title="Changer de thème"><i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i></button>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="login.html"><span class="brand-icon"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i></span><span><strong>NEXORA</strong><small>Réinitialisation sécurisée</small></span></a>
      <form class="needs-validation" data-pin-reset-confirm novalidate>
        <div class="mb-4"><p class="eyebrow mb-1">Accès sécurisé</p><h1 class="h3 mb-1">Nouveau code PIN</h1><p class="text-muted mb-0">Choisissez un code de 4 à 6 chiffres.</p></div>
        <div class="mb-4"><label class="form-label" for="resetPin">Nouveau code PIN</label><input class="form-control" id="resetPin" type="password" inputmode="numeric" minlength="4" maxlength="6" required><div class="invalid-feedback">Le code PIN doit contenir entre 4 et 6 chiffres.</div></div>
        <div class="alert d-none" data-reset-confirm-message role="alert"></div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-shield-check" aria-hidden="true"></i> Réinitialiser le PIN</button>
      </form>
      <div class="auth-footer"><a href="login.html">Retour à la connexion</a></div>
    </section>
  </main>
  <script src="../../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script>
    document.querySelector('[data-pin-reset-confirm]').addEventListener('submit', function (event) {
      event.preventDefault();
      var form = event.currentTarget;
      var pin = document.getElementById('resetPin').value;
      if (!form.checkValidity() || !/^\d{4,6}$/.test(pin)) { form.classList.add('was-validated'); return; }
      var params = new URLSearchParams(window.location.search);
      var message = form.querySelector('[data-reset-confirm-message]');
      window.NexoraAPI.confirmPinReset(params.get('uid'), params.get('token'), pin).then(function (result) {
        message.className = 'alert alert-success';
        message.textContent = result.message;
        message.classList.remove('d-none');
        form.querySelector('button').disabled = true;
        window.setTimeout(function () { window.location.href = 'login.html'; }, 1200);
      }).catch(function (error) {
        message.className = 'alert alert-danger';
        message.textContent = error.message;
        message.classList.remove('d-none');
      });
    });
  </script>
</body>
</html>
