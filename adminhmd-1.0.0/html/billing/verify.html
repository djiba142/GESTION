<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vérification publique d'une facture NEXORA">
  <title>Vérification facture | NEXORA</title>
  <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <main class="container py-5" style="max-width: 640px">
    <section class="panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow mb-1">NEXORA</p>
          <h1 class="h3 mb-1">Vérification de facture</h1>
          <p class="text-muted mb-0">Contrôle public de l'authenticité et du statut de la facture.</p>
        </div>
      </div>
      <div id="verificationState" class="text-muted py-3" role="status">Vérification en cours...</div>
      <dl id="verificationDetails" class="row mb-0 d-none">
        <dt class="col-5">Facture</dt><dd class="col-7" data-field="invoice_number">-</dd>
        <dt class="col-5">Date</dt><dd class="col-7" data-field="issue_date">-</dd>
        <dt class="col-5">Montant</dt><dd class="col-7"><span data-field="total_amount">-</span> <span data-field="currency">GNF</span></dd>
        <dt class="col-5">Statut</dt><dd class="col-7" data-field="status">-</dd>
      </dl>
    </section>
  </main>
  <script>
    (function () {
      var state = document.getElementById("verificationState");
      var details = document.getElementById("verificationDetails");
      var token = new URLSearchParams(window.location.search).get("token");
      var apiBase = window.NEXORA_API_URL || "http://127.0.0.1:8000/api";

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, function (character) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character];
        });
      }

      if (!token) {
        state.className = "alert alert-danger";
        state.textContent = "Jeton de vérification manquant.";
        return;
      }

      fetch(apiBase.replace(/\/$/, "") + "/invoices/verify/" + encodeURIComponent(token) + "/")
        .then(function (response) {
          return response.json().then(function (payload) {
            if (!response.ok) throw new Error(payload.detail || "Facture introuvable.");
            return payload;
          });
        })
        .then(function (invoice) {
          state.className = invoice.valid ? "alert alert-success" : "alert alert-warning";
          state.innerHTML = invoice.valid ? "&#10003; FACTURE AUTHENTIQUE" : "&#9888; FACTURE ANNULÉE";
          ["invoice_number", "issue_date", "total_amount", "currency", "status"].forEach(function (field) {
            var element = details.querySelector("[data-field='" + field + "']");
            if (element) element.textContent = field === "issue_date" && invoice[field] ? new Date(invoice[field]).toLocaleDateString("fr-FR") : (invoice[field] || "-");
          });
          details.classList.remove("d-none");
        })
        .catch(function (error) {
          state.className = "alert alert-danger";
          state.textContent = escapeHtml(error.message);
        });
    })();
  </script>
</body>
</html>
