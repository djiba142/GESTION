<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Connexion NEXORA pour l'espace de gestion commerciale">
  <title>Authentification et sécurité UI | NEXORA</title>

  <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body class="auth-body">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
  </button>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="../dashboard/index.html"><span class="brand-icon"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i></span><span><strong>NEXORA</strong><small>Accédez à votre espace de gestion.</small></span></a>
      <form class="needs-validation" data-login-form novalidate>
        <div class="mb-4">
          <p class="eyebrow mb-1">Accès sécurisé</p>
          <h1 class="h3 mb-1">Bienvenue sur NEXORA</h1>
          <p class="text-muted mb-0">Connectez-vous pour accéder à votre espace de gestion.</p>
        </div>
        <div class="mb-3"><label class="form-label" for="loginIdentifier">Email, téléphone ou identifiant</label><input class="form-control" id="loginIdentifier" type="text" autocomplete="username" required><div class="invalid-feedback">Saisissez votre identifiant.</div></div>
        <div class="mb-3"><div class="d-flex justify-content-between"><label class="form-label" for="loginPin">Code PIN</label><a class="small fw-semibold" href="forgot-password.html">Mot de passe oublié ?</a></div><input class="form-control" id="loginPin" type="password" inputmode="numeric" maxlength="6" required><div class="invalid-feedback">Saisissez votre code PIN.</div></div>
        <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="rememberMe"><label class="form-check-label" for="rememberMe">Se souvenir de moi</label></div>
        <div class="alert alert-danger d-none" data-login-error role="alert"></div>
        <button class="btn btn-primary w-100" type="submit" data-login-submit><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Se connecter</button>
      </form>
      
    </section>
  </main>

  <script src="../../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script>
    document.querySelector("[data-login-form]").addEventListener("submit", function (event) {
      event.preventDefault();
      var form = event.currentTarget;
      if (!form.checkValidity()) { form.classList.add("was-validated"); return; }

      var button = form.querySelector("[data-login-submit]");
      var errorElement = form.querySelector("[data-login-error]");
      button.disabled = true;
      errorElement.classList.add("d-none");

      window.NexoraAPI.login(
        document.getElementById("loginIdentifier").value.trim(),
        document.getElementById("loginPin").value
      ).then(function () {
        window.location.href = "../dashboard/index.html";
      }).catch(function (error) {
        errorElement.textContent = error.message;
        errorElement.classList.remove("d-none");
        button.disabled = false;
      });
    });
  </script>
</body>
</html>
